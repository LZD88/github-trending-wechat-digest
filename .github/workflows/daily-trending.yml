name: Daily GitHub Trending to WeChat

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - run
          - resend
          - test-binding
      target_date:
        description: Target date for preview/run/resend (YYYY-MM-DD)
        required: false
        type: string
      environment_label:
        description: Label included in the binding test message
        required: false
        default: github-actions
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: github-trending-wechat
  cancel-in-progress: false

jobs:
  digest:
    if: ${{ github.event_name != 'schedule' || vars.DAILY_DIGEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify project
        run: |
          ruff format --check .
          ruff check .
          pytest

      - name: Run requested operation
        id: operation
        shell: bash
        env:
          MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
          TARGET_DATE: ${{ inputs.target_date }}
          ENVIRONMENT_LABEL: ${{ inputs.environment_label || 'github-actions' }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_USE_GITHUB_MODELS: "true"
          SUMMARY_API_BASE: ${{ vars.SUMMARY_API_BASE }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
        run: |
          set +e
          case "$MODE" in
            preview)
              if [[ -n "$TARGET_DATE" ]]; then
                github-trending-wechat preview --date "$TARGET_DATE"
              else
                github-trending-wechat preview
              fi
              ;;
            run)
              if [[ -n "$TARGET_DATE" ]]; then
                github-trending-wechat run --date "$TARGET_DATE"
              else
                github-trending-wechat run
              fi
              ;;
            resend)
              if [[ -z "$TARGET_DATE" ]]; then
                echo "target_date is required for resend" >&2
                status=2
              else
                github-trending-wechat resend --date "$TARGET_DATE"
              fi
              ;;
            test-binding)
              github-trending-wechat test-binding --environment "$ENVIRONMENT_LABEL"
              ;;
            *)
              echo "unsupported mode: $MODE" >&2
              status=2
              ;;
          esac
          status=${status:-$?}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit non-sensitive run records
        if: ${{ steps.operation.outputs.exit_status != '' && github.event_name == 'schedule' || inputs.mode != 'preview' }}
        shell: bash
        run: |
          if [[ ! -d data ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          git diff --cached --quiet || git commit -m "data: update GitHub trending digest records [skip ci]"
          git push

      - name: Propagate operation failure
        if: ${{ steps.operation.outputs.exit_status != '0' }}
        shell: bash
        env:
          EXIT_STATUS: ${{ steps.operation.outputs.exit_status }}
        run: exit "$EXIT_STATUS"

