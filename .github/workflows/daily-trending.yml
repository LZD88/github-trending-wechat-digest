name: Daily GitHub Trending to WeChat

on:
  schedule:
    - cron: "55 23 * * *"
      timezone: "Asia/Shanghai"
    - cron: "0 8 * * *"
      timezone: "Asia/Shanghai"
    # Any trigger can resume pending work based on the actual local clock.
    - cron: "17 * * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - capture
          - run
          - recover
          - resend
          - test-binding
      target_date:
        description: Target date for preview/run/recover/resend (YYYY-MM-DD)
        required: false
        type: string
      environment_label:
        description: Label included in the binding test message
        required: false
        default: github-actions
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: github-trending-wechat
  cancel-in-progress: false

jobs:
  digest:
    if: ${{ github.event_name != 'schedule' || vars.DAILY_DIGEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Choose operation from the Beijing clock
        id: schedule
        if: ${{ github.event_name == 'schedule' }}
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from github_trending_wechat.scheduling import scheduled_operation, shanghai_now

          now = shanghai_now()
          mode, target = scheduled_operation(now)
          if mode == "capture" and Path(f"data/digests/{target}.json").is_file():
              mode = "idle"
          print(f"beijing_time={now.isoformat()} mode={mode} target_date={target or ''}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"mode={mode}", file=output)
              print(f"target_date={target or ''}", file=output)
          PY

      - name: Set up Python
        if: ${{ steps.schedule.outputs.mode != 'idle' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        if: ${{ steps.schedule.outputs.mode != 'idle' }}
        run: python -m pip install -e ".[dev]"

      - name: Verify project
        if: ${{ steps.schedule.outputs.mode != 'idle' }}
        run: |
          ruff format --check .
          ruff check .
          pytest

      - name: Run requested operation
        id: operation
        if: ${{ steps.schedule.outputs.mode != 'idle' }}
        shell: bash
        env:
          MODE: ${{ steps.schedule.outputs.mode || inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DATE: ${{ steps.schedule.outputs.target_date || inputs.target_date }}
          ENVIRONMENT_LABEL: ${{ inputs.environment_label || 'github-actions' }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_USE_GITHUB_MODELS: "true"
          SUMMARY_API_BASE: ${{ vars.SUMMARY_API_BASE }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
        run: |
          set +e
          case "$MODE" in
            preview)
              if [[ -n "$TARGET_DATE" ]]; then
                github-trending-wechat preview --date "$TARGET_DATE"
              else
                github-trending-wechat preview
              fi
              ;;
            capture)
              if [[ "$EVENT_NAME" == schedule ]]; then
                github-trending-wechat capture --scheduled
              else
                github-trending-wechat capture
              fi
              ;;
            run|recover)
              args=(run)
              if [[ "$MODE" == recover ]]; then
                args+=(--recover-missing)
              fi
              if [[ -n "$TARGET_DATE" ]]; then
                args+=(--date "$TARGET_DATE")
              fi
              github-trending-wechat "${args[@]}"
              ;;
            resend)
              if [[ -z "$TARGET_DATE" ]]; then
                echo "target_date is required for resend" >&2
                status=2
              else
                github-trending-wechat resend --date "$TARGET_DATE"
              fi
              ;;
            test-binding)
              github-trending-wechat test-binding --environment "$ENVIRONMENT_LABEL"
              ;;
            *)
              echo "unsupported mode: $MODE" >&2
              status=2
              ;;
          esac
          status=${status:-$?}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit non-sensitive run records
        if: ${{ steps.operation.outputs.exit_status != '' && (github.event_name == 'schedule' || inputs.mode != 'preview') }}
        shell: bash
        run: |
          if [[ ! -d data ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update GitHub trending digest records [skip ci]"
          git push

      - name: Propagate operation failure
        if: ${{ steps.operation.outputs.exit_status != '' && steps.operation.outputs.exit_status != '0' }}
        shell: bash
        env:
          EXIT_STATUS: ${{ steps.operation.outputs.exit_status }}
        run: exit "$EXIT_STATUS"

