[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "github-trending-wechat"
version = "0.1.0"
description = "Daily GitHub Trending top 10 digest delivered to personal WeChat via ServerChan."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "GitHub Trending WeChat contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "PyYAML>=6,<7",
]

[project.scripts]
github-trending-wechat = "github_trending_wechat.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

